# Runs every test suite of docs/SDD-TESTES.md (functional, accessibility and
# security) on each push. When a tag like v1.4.0 is pushed and every test passes,
# builds the .nvda-addon and publishes it as a GitHub release (the download URL
# used in the NVDA Add-on Store submission). If any test fails, nothing is published.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install wxPython, virtual display, gettext and bandit
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wxgtk4.0 xvfb gettext imagemagick
          /usr/bin/python3 -m pip install --user --break-system-packages bandit
      - name: Run every test suite (functional, accessibility, security) and build
        run: /usr/bin/python3 tests/run_all.py --note "GitHub Actions ${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NVDAIAs-test-reports
          path: |
            reports/ULTIMA-EXECUCAO.md
            reports/execucoes.json
      - uses: actions/upload-artifact@v4
        with:
          name: NVDAIAs
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.nvda-addon
            dist/*.sha256
          body_path: CHANGELOG.md
