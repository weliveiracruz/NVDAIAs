summary = "NVDAIAs - Converse com o ChatGPT, o Gemini e o Claude"
description = """Converse com o ChatGPT (OpenAI), o Gemini (Google) ou o Claude (Anthropic) em uma janela acessível do NVDA. Pressione NVDA+Alt+I, digite a pergunta e pressione Enter; com Shift+Tab você chega à lista da conversa. Cada IA é conectada com um token de acesso (chave de API) gerado no site do provedor e guardado de forma criptografada no computador. Também descreve o objeto de navegação ou a tela com NVDA+Alt+D e NVDA+Shift+Alt+D."""
changelog = """Ações da mensagem: Enter (ou a tecla Aplicações) numa mensagem, ou o novo botão Ações da mensagem, abre um menu com Ler, Copiar, Excluir, Traduzir para (12 idiomas), Descrever esta imagem com mais detalhes e Melhorar esta resposta. Segurança: proteção contra bombas zip e XML inseguro em documentos anexados, a chave de API nunca segue redirecionamentos, limite de tamanho da resposta e só HTTPS. Acessibilidade: nomes únicos nos botões das configurações e tradução completa. Novo plano de testes (docs/SDD-TESTES.md) com testes funcionais, de acessibilidade e de segurança antes de cada versão."""
