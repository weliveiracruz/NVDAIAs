summary = "NVDAIAs - Converse com o ChatGPT, o Gemini e o Claude"
description = """Converse com o ChatGPT (OpenAI), o Gemini (Google) ou o Claude (Anthropic) em uma janela acessível do NVDA. Pressione NVDA+Alt+I, digite a pergunta e pressione Enter; com Shift+Tab você chega à lista da conversa. O ChatGPT pode usar o seu plano do ChatGPT com Continuar com o ChatGPT (sem chave de API); cada IA também pode ser conectada com um token de acesso (chave de API) gerado no site do provedor. As credenciais ficam guardadas de forma criptografada no computador. Também descreve o objeto de navegação ou a tela com NVDA+Alt+D e NVDA+Shift+Alt+D."""
changelog = """Layout moderno: barra superior laranja, cartões brancos com cantos arredondados, chip de situação, anel de foco laranja arredondado e novos design tokens (cores, fontes, espaçamentos, raios). Textos em português com tom próximo, simples e direto. A leitura pelo NVDA, a ordem de tabulação e os atalhos não mudaram."""
