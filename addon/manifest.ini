name = NVDAIAs
summary = "NVDAIAs - Chat with ChatGPT, Gemini and Claude"
description = """Chat with ChatGPT (OpenAI), Gemini (Google) or Claude (Anthropic) from an accessible NVDA window. Press NVDA+Alt+I, type the question and press Enter; Shift+Tab goes to the conversation list. Each AI is connected with an access token (API key) generated on the provider's site and stored encrypted on the computer. It can also describe the navigator object or the screen with NVDA+Alt+D and NVDA+Shift+Alt+D."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NVDAIAs
version = 1.4.0
changelog = """Message actions: Enter (or the Applications key) on a message, or the new Actions button, opens a menu with Read, Copy, Delete, Translate to (12 languages), Describe this image in more detail and Improve this answer. Security: protection against zip bombs and unsafe XML in attached documents, API keys never follow redirects, answer size limit, HTTPS only. Accessibility: unique names for the settings buttons, complete Portuguese translation. New test plan (docs/SDD-TESTES.md) with functional, accessibility and security tests run before every release."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.2.0
