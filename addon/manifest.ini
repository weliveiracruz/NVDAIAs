name = NVDAIAs
summary = "NVDAIAs - Chat with ChatGPT, Gemini and Claude"
description = """Chat with ChatGPT (OpenAI), Gemini (Google) or Claude (Anthropic) from an accessible NVDA window. Press NVDA+Alt+I, type the question and press Enter; Shift+Tab goes to the conversation list. ChatGPT can use your ChatGPT plan with Continue with ChatGPT (no API key); each AI can also be connected with an access token (API key) generated on the provider's site. Credentials are stored encrypted on the computer. It can also describe the navigator object or the screen with NVDA+Alt+D and NVDA+Shift+Alt+D."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NVDAIAs
version = 1.7.0
changelog = """Continue with ChatGPT: sign in with your ChatGPT account and use your ChatGPT plan (Plus, Pro and others) without an API key, following OpenAI's Sign in with ChatGPT for open-source apps. The API token option stays available. Indicator of the plan in the chat window and Manage ChatGPT usage button. Gemini and Claude do not offer an equivalent and keep using tokens."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.2.0
